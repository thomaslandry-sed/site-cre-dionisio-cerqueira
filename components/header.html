
<!-- CABEÇALHO INSTITUCIONAL VERDE -->
<header class="site-header cre-green-header" id="inicio">

  <div class="container cre-header-inner">

      <!-- MENU MOBILE -->
      <button
        class="icon-button menu-toggle cre-header-menu"
        id="menuToggle"
        type="button"
        aria-label="Abrir menu"
        aria-controls="mobileNav"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6.5h16M4 12h16M4 17.5h16"></path>
        </svg>
      </button>

    <!-- IDENTIDADE DA COORDENADORIA -->
    <a
      class="cre-header-brand"
      href="index.html"
      aria-label="CRE Dionísio Cerqueira, página inicial"
    >
      <img
        class="cre-header-flag"
        src="assets/bandeira-sc.png"
        alt="Bandeira de Santa Catarina"
        width="74"
        height="54"
      >

      <span class="cre-header-divider" aria-hidden="true"></span>

      <span class="cre-header-name">
        <span>Coordenadoria Regional de Educação</span>
        <strong>Dionísio Cerqueira – SC</strong>
      </span>
    </a>

    <!-- MENU DESKTOP -->
    <nav
      class="desktop-nav cre-header-nav"
      aria-label="Navegação principal"
    >
      <a href="index.html">Início</a>
      <a href="professores.html">Professores</a>
      <a href="orientadores.html">Orientadores</a>
      <a href="eventos.html">Eventos</a>
      <a href="equipe.html">Nossa Equipe</a>
      <a href="index.html#localizacao">Contato</a>
    </nav>

    <div class="cre-header-actions">

      <!-- BOTÃO REDES SOCIAIS -->
      <a
        class="cre-header-social"
        href="index.html#redes-sociais"
        aria-label="Ir para as redes sociais da CRE"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="18" cy="5" r="2.4"></circle>
          <circle cx="6" cy="12" r="2.4"></circle>
          <circle cx="18" cy="19" r="2.4"></circle>
          <path d="m8.2 10.8 7.5-4.6M8.2 13.2l7.5 4.6"></path>
        </svg>
        <span>Redes Sociais</span>
      </a>

      <!-- BUSCA DAS NOTÍCIAS -->
      <button
        class="icon-button cre-header-search"
        id="searchToggle"
        type="button"
        aria-label="Buscar notícias"
        aria-controls="searchPanel"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.3"></circle>
          <path d="m15.3 15.3 5 5"></path>
        </svg>
      </button>

    

    </div>
  </div>

  <!-- PAINEL DE BUSCA -->
  <div class="container">
    <div class="search-panel cre-header-search-panel" id="searchPanel" hidden>
      <label for="siteSearch">Buscar notícias</label>

      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.3"></circle>
          <path d="m15.3 15.3 5 5"></path>
        </svg>

        <input
          id="siteSearch"
          type="search"
          placeholder="Digite uma palavra-chave..."
          autocomplete="off"
        >

        <button type="button" id="searchClear">
          Limpar
        </button>
      </div>

      <p>Pesquise entre as notícias da página inicial.</p>
    </div>
  </div>

  <!-- NAVEGAÇÃO MOBILE -->
  <nav
    class="mobile-nav cre-header-mobile"
    id="mobileNav"
    aria-label="Navegação para celular"
    hidden
  >
    <a href="index.html">Início</a>
    <a href="professores.html">Professores</a>
    <a href="orientadores.html">Orientadores</a>
    <a href="eventos.html">Eventos</a>
    <a href="equipe.html">Nossa Equipe</a>
    <a href="index.html#localizacao">Contato</a>
    <a href="index.html#redes-sociais">Redes Sociais</a>
  </nav>

</header>
